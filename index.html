<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pink Muse — prototype interactif</title>
<style>
:root{--pink:#ffdeeb;--hot:#ed6fa0;--rose:#b83d72;--ink:#4b2438;--muted:#8b6879;--cream:#fff8fc;--line:#f2cddd;--lav:#f2e5ff}
*{box-sizing:border-box}body{margin:0;background:#fff1f7;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:560px;min-height:100vh;margin:auto;background:var(--cream);box-shadow:0 0 40px #d77ca51c;overflow:hidden}
header{padding:23px 19px;background:linear-gradient(135deg,#ffcce1,#f7dcff 58%,#fff0f6);border-radius:0 0 28px 28px;position:relative}.logo{font-size:12px;font-weight:900;letter-spacing:3px;text-transform:uppercase;color:#a33c70}.hero{font-size:28px;line-height:1.12;font-weight:850;margin:9px 0}.sub{color:#80566b;font-size:13px;line-height:1.5}.pill{display:inline-block;border-radius:30px;background:#fff9;padding:7px 11px;font-size:11px;font-weight:800;margin-top:7px}
nav{display:flex;gap:5px;padding:10px;background:#fff;position:sticky;top:0;z-index:2;box-shadow:0 3px 12px #6c1b3910}nav button{flex:1;border:0;border-radius:12px;padding:10px 3px;background:transparent;color:var(--muted);font-size:11px;font-weight:800}nav button.active{background:var(--pink);color:var(--rose)}
main{padding:17px}.title{font-size:21px;font-weight:850;margin:5px 0 6px}.muted{color:var(--muted);font-size:13px;line-height:1.45}.card{background:white;border:1px solid var(--line);border-radius:19px;padding:14px;margin:12px 0;box-shadow:0 6px 18px #8c31500a}.btn{border:0;background:var(--rose);color:white;padding:12px 15px;border-radius:13px;font-weight:800;cursor:pointer}.btn.secondary{background:#ffe6f0;color:var(--rose)}.row{display:flex;align-items:center;gap:9px}.row>*{min-width:0}.row .grow{flex:1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.piece{border:1px solid var(--line);border-radius:16px;background:#fff;padding:10px;position:relative}.emoji{height:90px;border-radius:12px;background:linear-gradient(140deg,#fff0f6,#f3e8ff);display:grid;place-items:center;font-size:48px;margin-bottom:8px;overflow:hidden}.emoji img{width:100%;height:100%;object-fit:cover}.piece strong{font-size:13px;display:block}.piece small{color:var(--muted);font-size:11px}.piece button{margin-top:8px;width:100%;font-size:11px;padding:9px}.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;color:var(--ink);margin:5px 0 10px;font:inherit}.notice{font-size:11px;line-height:1.45;color:var(--muted);background:#fff0f6;padding:12px;border-radius:12px}.empty{text-align:center;padding:22px;color:var(--muted);font-size:13px}.look{background:linear-gradient(135deg,#ffe6f0,#f4e8ff);border-radius:18px;padding:14px;text-align:center}.lookitems{font-size:39px;letter-spacing:5px;padding:10px}.tag{display:inline-block;border-radius:20px;background:#fff;padding:5px 9px;font-size:10px;font-weight:800;color:var(--rose)}.store{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid #fae4ee}.storelogo{width:42px;height:42px;border-radius:13px;background:#ffe7f1;display:grid;place-items:center;font-weight:900;color:var(--rose)}.storetext{flex:1}.storetext small{display:block;color:var(--muted);font-size:11px}.toggle{accent-color:var(--rose);width:18px;height:18px}footer{text-align:center;padding:15px;color:#ad8196;font-size:10px}
</style></head>
<body><div class="app">
<header><div class="logo">✦ PINK MUSE</div><div class="hero">Ton style.<br>À ta façon. 💗</div><div class="sub">Des looks qui te ressemblent, avec ce que tu as déjà ou tes prochaines pièces coup de cœur.</div><span class="pill">DÉMO INTERACTIVE · VERSION 2</span></header>
<nav><button data-tab="discover" class="active">✨ Découvrir</button><button data-tab="wardrobe">👚 Dressing</button><button data-tab="create">💞 Créer un look</button><button data-tab="stores">🛍️ Boutiques</button></nav>
<main id="view"></main><footer>Pink Muse · Prototype en cours de création</footer></div>
<script>
const starter=[
{id:1,name:"Top rose",type:"Haut",emoji:"👚",color:"Rose"},{id:2,name:"T-shirt blanc",type:"Haut",emoji:"👕",color:"Blanc"},
{id:3,name:"Jean droit",type:"Bas",emoji:"👖",color:"Bleu"},{id:4,name:"Jupe noire",type:"Bas",emoji:"👗",color:"Noir"},
{id:5,name:"Baskets blanches",type:"Chaussures",emoji:"👟",color:"Blanc"},{id:6,name:"Sac rose",type:"Accessoire",emoji:"👜",color:"Rose"},
{id:7,name:"Lunettes",type:"Accessoire",emoji:"🕶️",color:"Noir"},{id:8,name:"Pull lilas",type:"Haut",emoji:"🧥",color:"Lilas"}];
let wardrobe=JSON.parse(localStorage.getItem("pm_wardrobe")||"null")||starter;
let looks=JSON.parse(localStorage.getItem("pm_looks")||"[]"), stores=JSON.parse(localStorage.getItem("pm_stores")||'["Zara","H&M","Bershka"]');
let tab="discover", selected={};
const $=s=>document.querySelector(s);
function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=reject;reader.onload=()=>{const img=new Image();img.onerror=reject;img.onload=()=>{const max=700,scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext("2d").drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",0.72))};img.src=reader.result};reader.readAsDataURL(file)})}
function save(){localStorage.setItem("pm_wardrobe",JSON.stringify(wardrobe));localStorage.setItem("pm_looks",JSON.stringify(looks));localStorage.setItem("pm_stores",JSON.stringify(stores))}
function piece(p,buttonText,action){return `<div class="piece"><div class="emoji">${p.photo?`<img src="${p.photo}" alt="${p.name}">`:p.emoji}</div><strong>${p.name}</strong><small>${p.type} · ${p.color}</small><button class="btn secondary" data-action="${action}" data-id="${p.id}">${buttonText}</button></div>`}
function makeLook(){let types=["Haut","Bas","Chaussures","Accessoire"];let result={};types.forEach(t=>{let arr=wardrobe.filter(p=>p.type===t);if(arr.length)result[t]=arr[Math.floor(Math.random()*arr.length)]});return result}
function lookHTML(l){return `<div class="look"><span class="tag">LOOK PINK MUSE</span><div class="lookitems">${Object.values(l).map(p=>p.photo?`<img src="${p.photo}" alt="" style="width:54px;height:54px;object-fit:cover;border-radius:12px;vertical-align:middle;margin:3px">`:p.emoji).join(" + ")||"✨"}</div><strong>${Object.values(l).map(p=>p.name).join(" · ")||"Ajoute des pièces à ton dressing"}</strong></div>`}
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));let v=$("#view");
if(tab==="discover"){v.innerHTML=`<div class="title">Hello Muse ✨</div><p class="muted">Ton inspiration mode du jour commence ici.</p><div class="card">${lookHTML(makeLook())}<button class="btn" style="width:100%;margin-top:10px" id="surprise">✨ Me proposer un look</button></div><div class="title">Ton espace mode</div><div class="grid"><div class="card"><div style="font-size:28px">👚</div><strong>${wardrobe.length} pièces</strong><p class="muted">dans ton dressing</p><button class="btn secondary" data-goto="wardrobe">Mon dressing</button></div><div class="card"><div style="font-size:28px">💗</div><strong>${looks.length} looks</strong><p class="muted">enregistrés</p><button class="btn secondary" data-goto="create">Composer</button></div></div><div class="notice">Les vêtements affichés ici sont des exemples de démonstration, pas des articles synchronisés avec des boutiques.</div>`;$("#surprise").onclick=()=>{tab="create";selected=makeLook();render()}}
else if(tab==="wardrobe"){v.innerHTML=`<div class="title">Mon dressing 👗</div><p class="muted">Ajoute tes pièces et retrouve-les ici.</p><div class="card"><label>Nom du vêtement</label><input id="pname" class="field" placeholder="Ex. Mon cardigan préféré"><label>Catégorie</label><select id="ptype" class="field"><option>Haut</option><option>Bas</option><option>Chaussures</option><option>Accessoire</option></select><label>Photo du vêtement (facultatif)</label><input id="pphoto" class="field" type="file" accept="image/*" capture="environment"><small class="muted">Choisis une photo dans ta galerie ou prends-en une avec ton téléphone.</small><label>Emoji si tu n’ajoutes pas de photo</label><select id="pemoji" class="field"><option>👚</option><option>👕</option><option>🧥</option><option>👖</option><option>👗</option><option>🩳</option><option>👟</option><option>👢</option><option>👜</option><option>🕶️</option><option>💍</option></select><button id="add" class="btn">+ Ajouter à mon dressing</button></div><div class="grid">${wardrobe.map(p=>piece(p,"Supprimer","delete")).join("")||'<div class="empty">Ton dressing est vide.</div>'}</div><div class="notice">Pour cette version, les pièces sont représentées par des emojis. L’ajout de photos pourra être développé ensuite.</div>`;$("#add").onclick=async()=>{let name=$("#pname").value.trim();if(!name){alert("Donne un nom à ta pièce 😊");return}
let photo="";const file=$("#pphoto").files[0];
if(file){if(!file.type.startsWith("image/")){alert("Choisis un fichier image.");return}
try{photo=await compressImage(file)}catch(e){alert("Impossible de lire cette photo. Essaie une autre image.");return}}
wardrobe.push({id:Date.now(),name,type:$("#ptype").value,emoji:$("#pemoji").value,color:"À définir",photo});try{save();render()}catch(e){wardrobe.pop();alert("Le stockage est plein. Essaie une photo plus petite.");}}}
else if(tab==="create"){let types=["Haut","Bas","Chaussures","Accessoire"];v.innerHTML=`<div class="title">Créons ton look 💞</div><p class="muted">Choisis chaque pièce toi-même ou laisse Pink Muse te surprendre.</p><div class="row"><button class="btn" id="manual">🎀 Mode manuel</button><button class="btn secondary" id="auto">✨ Surprise</button></div><div class="card" id="builder">${types.map(t=>`<label>${t}</label><select class="field choose" data-type="${t}"><option value="">Choisir…</option>${wardrobe.filter(p=>p.type===t).map(p=>`<option value="${p.id}" ${selected[t]==p.id?"selected":""}>${p.emoji} ${p.name}</option>`).join("")}</select>`).join("")}<div id="preview">${lookHTML(Object.fromEntries(types.map(t=>[t,wardrobe.find(p=>p.id==selected[t])]).filter(x=>x[1])))}</div><button class="btn" id="saveLook" style="width:100%;margin-top:12px">💗 Enregistrer ce look</button></div><div class="title">Mes looks enregistrés</div>${looks.length?looks.map((l,i)=>`<div class="card">${lookHTML(l)}<button class="btn secondary" data-action="dellook" data-id="${i}">Supprimer ce look</button></div>`).join(""):'<div class="empty">Tes créations apparaîtront ici.</div>'}`;$("#auto").onclick=()=>{selected=makeLook();render()};$("#manual").onclick=()=>{$("#builder").scrollIntoView({behavior:"smooth"})};document.querySelectorAll(".choose").forEach(s=>s.onchange=()=>{selected[s.dataset.type]=Number(s.value)||"";let l=Object.fromEntries(types.map(t=>[t,wardrobe.find(p=>p.id==selected[t])]).filter(x=>x[1]));$("#preview").innerHTML=lookHTML(l)});$("#saveLook").onclick=()=>{let l=Object.fromEntries(types.map(t=>[t,wardrobe.find(p=>p.id==selected[t])]).filter(x=>x[1]));if(!Object.keys(l).length){alert("Choisis au moins une pièce avant d’enregistrer 💗");return}looks.unshift(l);save();render()}}
else{
let all=["Zara","H&M","Mango","Pull&Bear","Bershka","Nike","Uniqlo","ASOS"];
let shopLinks={
"Zara":"https://www.zara.com/fr/fr/","H&M":"https://www2.hm.com/fr_fr/index.html",
"Mango":"https://shop.mango.com/fr/fr","Pull&Bear":"https://www.pullandbear.com/fr/",
"Bershka":"https://www.bershka.com/fr/","Nike":"https://www.nike.com/fr/",
"Uniqlo":"https://www.uniqlo.com/fr/fr/","ASOS":"https://www.asos.com/fr/"
};
let categoryLinks={
"Zara":{"Nouveautés":"https://www.zara.com/fr/fr/femme-nouveau-l1180.html","Hauts":"https://www.zara.com/fr/fr/femme-tops-l1322.html","Pantalons & jeans":"https://www.zara.com/fr/fr/femme-jeans-l1119.html","Chaussures":"https://www.zara.com/fr/fr/femme-chaussures-l1251.html"},
"H&M":{"Nouveautés":"https://www2.hm.com/fr_fr/femme/nouveautes.html","Hauts":"https://www2.hm.com/fr_fr/femme/produits/hauts.html","Pantalons & jeans":"https://www2.hm.com/fr_fr/femme/produits/jeans.html","Chaussures":"https://www2.hm.com/fr_fr/femme/produits/chaussures.html"},
"Mango":{"Nouveautés":"https://shop.mango.com/fr/fr/c/femme/nouveautes_4e8b3b6a","Hauts":"https://shop.mango.com/fr/fr/c/femme/vetements/t-shirts_3a8d3e3b","Pantalons & jeans":"https://shop.mango.com/fr/fr/c/femme/vetements/jeans_6e9c5a3b","Chaussures":"https://shop.mango.com/fr/fr/c/femme/chaussures_1b8f3b7a"},
"Pull&Bear":{"Nouveautés":"https://www.pullandbear.com/fr/femme-n6630","Hauts":"https://www.pullandbear.com/fr/femme/vetements/hauts-n6417","Pantalons & jeans":"https://www.pullandbear.com/fr/femme/vetements/pantalons-n6418","Chaussures":"https://www.pullandbear.com/fr/femme/chaussures-n6455"},
"Bershka":{"Nouveautés":"https://www.bershka.com/fr/femme/nouveautes-c1010193205.html","Hauts":"https://www.bershka.com/fr/femme/vetements/hauts-c1010193143.html","Pantalons & jeans":"https://www.bershka.com/fr/femme/vetements/pantalons-c1010193144.html","Chaussures":"https://www.bershka.com/fr/femme/chaussures-c1010193161.html"},
"Nike":{"Nouveautés":"https://www.nike.com/fr/w/femme-nouveautes-3n82y","Hauts":"https://www.nike.com/fr/w/femme-hauts-t-shirts-5e1x6z6ymx6","Pantalons & jeans":"https://www.nike.com/fr/w/femme-pantalons-tights-2kq19z5e1x6","Chaussures":"https://www.nike.com/fr/w/femme-chaussures-5e1x6zy7ok"},
"Uniqlo":{"Nouveautés":"https://www.uniqlo.com/fr/fr/feature/new/women","Hauts":"https://www.uniqlo.com/fr/fr/women/tops","Pantalons & jeans":"https://www.uniqlo.com/fr/fr/women/bottoms","Chaussures":"https://www.uniqlo.com/fr/fr/women/accessories"},
"ASOS":{"Nouveautés":"https://www.asos.com/fr/femme/nouveautes/cat/?cid=27108","Hauts":"https://www.asos.com/fr/femme/hauts/cat/?cid=4169","Pantalons & jeans":"https://www.asos.com/fr/femme/pantalons-jeans/cat/?cid=3630","Chaussures":"https://www.asos.com/fr/femme/chaussures/cat/?cid=4172"}
};
let chosen=$("#shopFilter")?.value||"Toutes";
let visible=chosen==="Toutes"?all:[chosen];
v.innerHTML=`<div class="title">Boutiques & nouveautés 🛍️</div>
<p class="muted">Accède aux vrais catalogues des enseignes et explore par catégorie. Les liens ouvrent les sites officiels.</p>
<div class="card"><label>Filtrer les boutiques</label><select id="shopFilter" class="field"><option ${chosen==="Toutes"?"selected":""}>Toutes</option>${all.map(s=>`<option ${chosen===s?"selected":""}>${s}</option>`).join("")}</select>
<strong>Mes boutiques favorites</strong>${all.map(s=>`<div class="store"><div class="storelogo">${s.slice(0,2).toUpperCase()}</div><div class="storetext"><strong>${s}</strong><small>${stores.includes(s)?"Dans tes favoris":"Pas encore suivie"}</small></div><a class="btn secondary" style="text-decoration:none;padding:8px 10px;font-size:11px" href="${shopLinks[s]}" target="_blank" rel="noopener">Visiter</a><input aria-label="Favori ${s}" class="toggle" type="checkbox" data-store="${s}" ${stores.includes(s)?"checked":""}></div>`).join("")}</div>
<div class="title">Explorer les articles ✨</div>
${visible.map(s=>`<div class="card"><div class="row"><div class="storelogo">${s.slice(0,2).toUpperCase()}</div><div class="grow"><strong>${s}</strong><div class="muted">Catalogue officiel</div></div><a href="${shopLinks[s]}" target="_blank" rel="noopener" class="btn secondary" style="text-decoration:none">Tout voir</a></div><div class="row" style="flex-wrap:wrap;margin-top:12px">${Object.entries(categoryLinks[s]).map(([cat,url])=>`<a class="btn secondary" style="text-decoration:none;font-size:11px;padding:9px 10px" href="${url}" target="_blank" rel="noopener">${cat}</a>`).join("")}</div></div>`).join("")}
<div class="notice">Les produits, photos, prix et stocks affichés sur les pages liées sont gérés par chaque boutique. Pink Muse ne les importe pas encore automatiquement : pour afficher ces données dans l’application, il faudra obtenir un flux catalogue ou une API autorisée. Les adresses de catégories peuvent changer ; si un lien ne marche pas, utilise « Tout voir ».</div>`;
$("#shopFilter").onchange=()=>{render()};
v.querySelectorAll("[data-store]").forEach(c=>c.onchange=()=>{stores=c.checked?[...new Set([...stores,c.dataset.store])]:stores.filter(s=>s!==c.dataset.store);save();render()})
}
v.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{tab=b.dataset.goto;render()});v.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>{if(b.dataset.action==="delete")wardrobe=wardrobe.filter(p=>p.id!=b.dataset.id);if(b.dataset.action==="dellook")looks.splice(Number(b.dataset.id),1);save();render()})
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
</script></body></html>
